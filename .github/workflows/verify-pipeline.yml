name: Verify Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-artifact-audit:
    name: Metadata & Artifact Audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Test required-artifact contract and normative requirement linter
        run: python3 -m unittest discover -s tests -p "test_artifacts.py" -v

      - name: Validate artifact metadata, IDs, and naming
        run: python3 scripts/artifacts.py validate

  initializer-regression-gate:
    name: Initializer Regression Gate
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run app initializer regression suite
        run: python3 -m unittest discover -s tests -p "test_init_app_project.py" -v

  typescript-static-analysis:
    name: TypeScript Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore exact npm dependencies
        run: npm ci

      - name: Compile TypeScript without emitting files
        run: npx --no-install tsc --noEmit

      - name: Run Vitest suite
        run: npm run test

      - name: Enforce configured 100 percent coverage thresholds
        run: npm run test:coverage
