name: FW-028 Feasibility Probes (Temporary)

on:
  push:
    branches:
      - codex/v2-backlog-roadmap
    paths:
      - .github/workflows/fw028-feasibility.yml
      - experiments/fw028/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs-typescript:
    name: Synthetic Next.js TypeScript profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Pin npm 12.1.0
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Run synthetic web profile
        run: timeout 900s python3 experiments/fw028/run_probe.py web

  fastapi-python:
    name: Synthetic FastAPI Python profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Run synthetic Python profile
        run: timeout 900s python3 experiments/fw028/run_probe.py python

  rust-axum:
    name: Synthetic Rust Axum profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Install Rust/Cargo 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component llvm-tools-preview
          rustup default 1.97.0
      - name: Run synthetic Rust profile
        run: timeout 900s python3 experiments/fw028/run_probe.py rust
