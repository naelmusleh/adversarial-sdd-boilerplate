name: FW-028 Feasibility Probes (Temporary)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Synthetic profile to run
        required: true
        type: choice
        options:
          - web
          - python
          - rust
          - all

permissions:
  contents: read
  checks: read

jobs:
  provider-check-binding:
    name: Provider-bound required check identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required checks against dispatch revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GH_REPO}/commits/${GH_SHA}/check-runs?per_page=100")"
          python3 -c '
          import json, os, sys
          checks = json.load(sys.stdin)["check_runs"]
          expected = {
              "Metadata & Artifact Audit",
              "Initializer Regression Gate",
              "TypeScript Static Code Analysis",
          }
          selected = [check for check in checks if check["name"] in expected]
          found = {check["name"] for check in selected}
          missing = expected - found
          if missing:
              raise SystemExit("missing provider check(s): " + ", ".join(sorted(missing)))
          for check in selected:
              if check["head_sha"] != os.environ["GH_SHA"]:
                  raise SystemExit("wrong head SHA for " + check["name"])
              if check["status"] != "completed" or check["conclusion"] != "success":
                  raise SystemExit("required check did not pass: " + check["name"])
              if not check.get("app") or check["app"].get("slug") != "github-actions":
                  raise SystemExit("unexpected check provider: " + check["name"])
              print(json.dumps({"id": check["id"], "name": check["name"], "head_sha": check["head_sha"], "status": check["status"], "conclusion": check["conclusion"], "app": check["app"]["slug"]}, sort_keys=True))
          ' <<< "$response"

  nextjs-typescript:
    if: inputs.profile == 'all' || inputs.profile == 'web'
    name: Synthetic Next.js TypeScript profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Pin npm 12.1.0
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Run synthetic web profile
        run: timeout 900s python3 experiments/fw028/run_probe.py web

  fastapi-python:
    if: inputs.profile == 'all' || inputs.profile == 'python'
    name: Synthetic FastAPI Python profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Run synthetic Python profile
        run: timeout 900s python3 experiments/fw028/run_probe.py python

  rust-axum:
    if: inputs.profile == 'all' || inputs.profile == 'rust'
    name: Synthetic Rust Axum profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Install Rust/Cargo 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component llvm-tools-preview
          rustup default 1.97.0
      - name: Run synthetic Rust profile
        run: timeout 900s python3 experiments/fw028/run_probe.py rust
