name: Artifact validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate artifact metadata and IDs
        run: python scripts/artifacts.py validate
