name: FW-030 Rootless Runtime Probe

on:
  workflow_call:

permissions: {}

jobs:
  rootless-policy-probe:
    name: Rootless policy and boundary probes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      FW030_SECRET_SENTINEL: synthetic-fw030-environment-only
    steps:
      - name: Probe pinned rootless runtime with synthetic input only
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly image='docker.io/library/alpine@sha256:dc92f017beea8e7f43263073d717f7bc011228c95d5312e440deb4d035bb4eec'
          readonly probe_dir="$(mktemp -d "${RUNNER_TEMP}/fw030.XXXXXX")"
          readonly input_dir="${probe_dir}/input"
          readonly output_dir="${probe_dir}/output"
          readonly host_sentinel="${probe_dir}/host-sentinel"
          readonly expected_sentinel='host-only-synthetic-marker-do-not-print'
          readonly network_name='fw030-positive-control'
          readonly server_ip='10.253.30.10'
          readonly container_uid=1000
          mkdir -m 755 "$input_dir"
          mkdir -m 777 "$output_dir"
          printf '%s\n' 'readable-synthetic-fixture' > "${input_dir}/fixture.txt"
          printf '%s' "$expected_sentinel" > "$host_sentinel"
          chmod 600 "$host_sentinel"
          ln -s "$host_sentinel" "${input_dir}/escape-link"
          parent_path="/input/../../${host_sentinel#/}"

          cleanup() {
            local status=$?
            local cleanup_failed=0
            local container_name
            local exists_status
            trap - EXIT
            for container_name in fw030-policy fw030-timeout fw030-interrupt fw030-resource fw030-cleanup-failure fw030-net-server; do
              set +e
              podman container exists "$container_name"
              exists_status=$?
              set -e
              if [[ "$exists_status" -eq 0 ]]; then
                if ! podman rm -f "$container_name" >/dev/null; then
                  printf 'cleanup failed to remove container: %s\n' "$container_name" >&2
                  cleanup_failed=1
                fi
              elif [[ "$exists_status" -ne 1 ]]; then
                printf 'cleanup could not determine container state: %s (exit=%s)\n' "$container_name" "$exists_status" >&2
                cleanup_failed=1
              fi
              set +e
              podman container exists "$container_name"
              exists_status=$?
              set -e
              if [[ "$exists_status" -eq 0 ]]; then
                printf 'cleanup left container present: %s\n' "$container_name" >&2
                cleanup_failed=1
              elif [[ "$exists_status" -ne 1 ]]; then
                printf 'cleanup could not verify container absence: %s (exit=%s)\n' "$container_name" "$exists_status" >&2
                cleanup_failed=1
              fi
            done
            set +e
            podman network exists "$network_name"
            exists_status=$?
            set -e
            if [[ "$exists_status" -eq 0 ]]; then
              if ! podman network rm "$network_name" >/dev/null; then
                printf 'cleanup failed to remove network: %s\n' "$network_name" >&2
                cleanup_failed=1
              fi
            elif [[ "$exists_status" -ne 1 ]]; then
              printf 'cleanup could not determine network state: %s (exit=%s)\n' "$network_name" "$exists_status" >&2
              cleanup_failed=1
            fi
            set +e
            podman network exists "$network_name"
            exists_status=$?
            set -e
            if [[ "$exists_status" -eq 0 ]]; then
              printf 'cleanup left network present: %s\n' "$network_name" >&2
              cleanup_failed=1
            elif [[ "$exists_status" -ne 1 ]]; then
              printf 'cleanup could not verify network absence: %s (exit=%s)\n' "$network_name" "$exists_status" >&2
              cleanup_failed=1
            fi
            if ! rm -rf "$probe_dir" || [[ -e "$probe_dir" ]]; then
              printf 'cleanup left temporary files present: %s\n' "$probe_dir" >&2
              cleanup_failed=1
            fi
            if [[ "$cleanup_failed" -ne 0 && "$status" -eq 0 ]]; then
              status=34
            fi
            if [[ "$cleanup_failed" -eq 0 ]]; then
              echo 'final_cleanup=PASS (containers, network, and temporary files absent)'
            fi
            exit "$status"
          }
          trap cleanup EXIT

          if [[ "$(uname -m)" != 'x86_64' ]]; then
            echo 'Unsupported runner architecture; no fallback.' >&2
            exit 20
          fi
          podman --version
          printf 'runner_os=%s\n' "$(. /etc/os-release && printf '%s' "$PRETTY_NAME")"
          printf 'runner_kernel=%s\n' "$(uname -sr)"
          printf 'runner_image_version=%s\n' "${ImageVersion:-not-reported}"
          printf 'runner_image_os=%s\n' "${ImageOS:-not-reported}"
          rootless="$(podman info --format '{{.Host.Security.Rootless}}')"
          if [[ "$rootless" != 'true' ]]; then
            echo 'Podman is not rootless; fail closed.' >&2
            exit 21
          fi
          printf 'podman_rootless=%s\n' "$rootless"
          podman info --format 'oci_runtime={{.Host.OCIRuntime.Name}} version={{.Host.OCIRuntime.Version}} storage_backend={{.Store.GraphDriverName}} network_backend={{.Host.NetworkBackend}}'

          # Host networking is used only to fetch the fixed digest before any workload runs.
          podman pull --platform linux/amd64 "$image"
          podman image inspect --format 'image_id={{.Id}}' "$image"

          # Establish a real, reachable local endpoint as the network-denial positive control.
          podman network create --internal --subnet 10.253.30.0/24 "$network_name" >/dev/null
          podman run --pull=never --detach --name fw030-net-server \
            --network "${network_name}:ip=${server_ip}" \
            "$image" sh -c '
              stop_server() {
                trap - TERM INT
                exit 0
              }
              trap stop_server TERM INT
              while :; do
                { printf "HTTP/1.1 200 OK\\r\\nContent-Length: 30\\r\\nConnection: close\\r\\n\\r\\nfw030-network-positive-control"; } |
                  /bin/busybox nc -l -p 8080 &
                listener_pid=$!
                wait "$listener_pid" || true
              done
            ' >/dev/null
          if [[ "$(podman inspect --format '{{.State.Running}}' fw030-net-server)" != 'true' ]]; then
            echo 'Positive-control server did not remain running.' >&2
            podman logs fw030-net-server >&2 || true
            exit 32
          fi
          positive_response="$(podman run --pull=never --rm --network "$network_name" "$image" \
            sh -c '/bin/busybox wget -T 3 -qO- "$1"' sh "http://${server_ip}:8080/")"
          if [[ "$positive_response" != 'fw030-network-positive-control' ]]; then
            echo 'Network positive control failed to reach the local synthetic endpoint.' >&2
            exit 33
          fi
          echo 'network_positive_control=PASS (reachable local synthetic endpoint)'

          policy_script="$(cat <<'SH'
          set -eu
          expected_uid="$4"
          endpoint="$5"
          test "$(id -u)" = "$expected_uid"
          test "$(cat /input/fixture.txt)" = 'readable-synthetic-fixture'
          test "${FW030_SECRET_SENTINEL-}" = ""
          if cat "$1" >/dev/null 2>&1; then echo "host sentinel readable" >&2; exit 41; fi
          if cat /input/escape-link >/dev/null 2>&1; then echo "symlink escaped" >&2; exit 42; fi
          if cat "$2" >/dev/null 2>&1; then echo "parent path escaped" >&2; exit 43; fi
          if touch /input/should-not-write 2>/dev/null; then echo "read-only input writable" >&2; exit 44; fi
          if /bin/busybox wget -T 2 -qO- "$endpoint" >/dev/null 2>&1; then echo "network reachable" >&2; exit 45; fi
          test ! -S /run/podman/podman.sock
          test ! -S /var/run/docker.sock
          printf "bounded synthetic output\n" > /output/result.txt
          sh -eu -c 'if cat "$1" >/dev/null 2>&1; then exit 51; fi; if /bin/busybox wget -T 2 -qO- "$2" >/dev/null 2>&1; then exit 52; fi' sh "$1" "$3"
          printf "policy_cases=PASS\n"
          SH
          )"

          # This tiny probe-only guard is not the framework adapter implementation.
          run_allowlisted() {
            local command=$1
            shift
            case "$command" in
              sh) podman run --pull=never --name fw030-policy \
                    --network=none --read-only --user "${container_uid}:${container_uid}" \
                    --cap-drop=all --security-opt=no-new-privileges \
                    --memory=128m --cpus=1 --pids-limit=32 \
                    --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                    --volume "${input_dir}:/input:ro" \
                    --volume "${output_dir}:/output:rw" \
                    "$image" sh -eu -c "$policy_script" sh "$host_sentinel" "$parent_path" "$endpoint" "$container_uid" "$endpoint" ;;
              *) return 64 ;;
            esac
          }

          endpoint="http://${server_ip}:8080/"
          run_allowlisted sh
          test -s "${output_dir}/result.txt"
          inspect="$(podman inspect fw030-policy)"
          jq '{network_mode: .[0].HostConfig.NetworkMode, readonly_rootfs: .[0].HostConfig.ReadonlyRootfs, memory_bytes: .[0].HostConfig.Memory, nano_cpus: .[0].HostConfig.NanoCpus, pids_limit: .[0].HostConfig.PidsLimit, cap_drop: .[0].HostConfig.CapDrop, effective_caps: .[0].EffectiveCaps, bounding_caps: .[0].BoundingCaps, security_opt: .[0].HostConfig.SecurityOpt, user: .[0].Config.User, mounts: [.[0].Mounts[] | {type: .Type, destination: .Destination, rw: .RW}] | sort_by(.destination), tmpfs: {path: "/tmp", options: .[0].HostConfig.Tmpfs["/tmp"]}}' <<< "$inspect"
          jq -e '
            .[0].HostConfig.NetworkMode == "none" and
            .[0].HostConfig.ReadonlyRootfs == true and
            .[0].HostConfig.Memory == 134217728 and
            .[0].HostConfig.NanoCpus == 1000000000 and
            .[0].HostConfig.PidsLimit == 32 and
            ((.[0].HostConfig.CapDrop | type == "array" and length > 0)) and
            ((.[0].EffectiveCaps | type == "array" and length == 0)) and
            ((.[0].BoundingCaps | type == "array" and length == 0)) and
            (any(.[0].HostConfig.SecurityOpt[]?; contains("no-new-privileges"))) and
            .[0].Config.User != "0:0" and
            ([.[0].Mounts[] | select(.Type == "bind") | .Destination] | sort == ["/input", "/output"]) and
            ([.[0].Mounts[] | select(.Type == "bind" and .Destination == "/input") | .RW] == [false]) and
            ([.[0].Mounts[] | select(.Type == "bind" and .Destination == "/output") | .RW] == [true]) and
            (.[0].HostConfig.Tmpfs as $tmpfs |
              (($tmpfs | keys | sort) == ["/tmp"]) and
              ($tmpfs["/tmp"] as $options |
                (($options | split(",") | index("rw")) != null) and
                (($options | split(",") | index("noexec")) != null) and
                (($options | split(",") | index("nosuid")) != null) and
                (($options | split(",") | any(.[]; . == "size=16m")))
              )
            )
          ' <<< "$inspect" >/dev/null
          echo 'configured_policy=PASS (none network; read-only root; 128MiB; one CPU configured; 32 PIDs; all capabilities dropped; no-new-privileges; input RO/output RW; non-root identity)'

          set +e
          run_allowlisted python -c 'print(1)'
          denied_command_status=$?
          set -e
          if [[ "$denied_command_status" -ne 64 ]]; then
            echo 'Denied command was not rejected by the probe guard.' >&2
            exit 22
          fi
          echo 'probe_guard_denied_command=PASS (harness only; not adapter evidence)'

          start_seconds="$(date +%s)"
          set +e
          podman run --pull=never --name fw030-timeout --timeout 2 \
            --network=none --read-only --user "${container_uid}:${container_uid}" \
            --cap-drop=all --security-opt=no-new-privileges --memory=128m --cpus=1 --pids-limit=32 \
            "$image" sleep 30 >/dev/null 2>&1
          timeout_status=$?
          set -e
          elapsed_seconds=$(( $(date +%s) - start_seconds ))
          timeout_state="$(podman inspect fw030-timeout)"
          jq -e '.[0].State.StartedAt != "" and .[0].State.Running == false and .[0].State.ExitCode == 137' <<< "$timeout_state" >/dev/null
          if [[ "$timeout_status" -ne 137 || "$elapsed_seconds" -gt 10 ]]; then
            echo 'Runtime timeout did not produce the expected started-container SIGKILL result.' >&2
            exit 23
          fi
          podman rm fw030-timeout >/dev/null
          if podman container exists fw030-timeout; then
            echo 'Timed-out container remains after cleanup.' >&2
            exit 24
          fi
          printf 'timeout=PASS (container started, exit=137, elapsed_seconds=%s, cleanup=PASS)\n' "$elapsed_seconds"

          set +e
          podman run --pull=never --name fw030-resource --timeout 30 \
            --network=none --read-only --user "${container_uid}:${container_uid}" \
            --cap-drop=all --security-opt=no-new-privileges --memory=128m --cpus=1 --pids-limit=32 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "${output_dir}:/output:rw" \
            "$image" sh -c 'printf started > /output/resource-started; dd if=/dev/zero of=/tmp/overflow bs=1M count=32 2>/output/resource-error; status=$?; cat /output/resource-error; exit "$status"' \
            >"${output_dir}/resource-stdout" 2>"${output_dir}/resource-stderr"
          resource_status=$?
          set -e
          if [[ "$resource_status" -ne 1 || ! -s "${output_dir}/resource-started" ]] || ! grep -Fq 'No space left on device' "${output_dir}/resource-error"; then
            echo 'Resource test did not reach the expected tmpfs ENOSPC result.' >&2
            cat "${output_dir}/resource-stderr" >&2 || true
            cat "${output_dir}/resource-error" >&2 || true
            exit 28
          fi
          podman rm fw030-resource >/dev/null
          if podman container exists fw030-resource; then
            echo 'Resource-limited container remains after cleanup.' >&2
            exit 29
          fi
          echo 'tmpfs_resource_ceiling=PASS (started synthetic write; exact ENOSPC diagnostic; container removed)'

          podman run --pull=never --name fw030-interrupt -d \
            --network=none --read-only --user "${container_uid}:${container_uid}" \
            --cap-drop=all --security-opt=no-new-privileges --memory=128m --cpus=1 --pids-limit=32 \
            "$image" sleep 30 >/dev/null
          podman stop --time 1 fw030-interrupt >/dev/null
          test "$(podman inspect --format '{{.State.Status}}' fw030-interrupt)" = 'exited'
          podman rm fw030-interrupt >/dev/null
          if podman container exists fw030-interrupt; then
            echo 'Interrupted container remains after cleanup.' >&2
            exit 25
          fi
          echo 'stop_signal_and_cleanup=PASS'

          podman run --pull=never --name fw030-cleanup-failure -d \
            --network=none --read-only --user "${container_uid}:${container_uid}" \
            --cap-drop=all --security-opt=no-new-privileges --memory=128m --cpus=1 --pids-limit=32 \
            "$image" sleep 30 >/dev/null
          test "$(podman inspect --format '{{.State.Running}}' fw030-cleanup-failure)" = 'true'
          set +e
          podman rm fw030-cleanup-failure 2>"${output_dir}/cleanup-error"
          cleanup_failure_status=$?
          set -e
          if [[ "$cleanup_failure_status" -eq 0 ]] || ! grep -Eiq '(running|stopped container|use -f)' "${output_dir}/cleanup-error"; then
            echo 'Runtime did not specifically refuse removal of the verified running container.' >&2
            cat "${output_dir}/cleanup-error" >&2 || true
            exit 30
          fi
          podman rm -f fw030-cleanup-failure >/dev/null
          if podman container exists fw030-cleanup-failure; then
            echo 'Cleanup recovery left the synthetic container behind.' >&2
            exit 31
          fi
          echo 'cleanup_failure_and_recovery=PASS (verified running target refused; force cleanup removed it)'

          set +e
          podman rm fw030-intentionally-missing-container >/dev/null 2>"${output_dir}/missing-cleanup-error"
          missing_cleanup_status=$?
          set -e
          if [[ "$missing_cleanup_status" -eq 0 ]] || ! grep -Eiq '(no such container|not found|does not exist)' "${output_dir}/missing-cleanup-error"; then
            echo 'Runtime did not expose the specific missing-container cleanup error.' >&2
            cat "${output_dir}/missing-cleanup-error" >&2 || true
            exit 26
          fi
          echo 'missing_cleanup_target=PASS (specific not-found response)'

          podman rm fw030-policy >/dev/null
          if podman container exists fw030-policy; then
            echo 'Policy probe container remains after cleanup.' >&2
            exit 27
          fi
          printf '%s\n' \
            'FW-030 synthetic rootless runtime probe completed.' \
            "source_sha=${GITHUB_SHA}" \
            "workflow_run_id=${GITHUB_RUN_ID}" \
            "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}" \
            'No source checkout, repository secrets, artifact upload, or host/runtime socket mount was used.' \
            'This result is limited to the observed ephemeral runner, runtime, pinned image, and cases.' \
            >> "$GITHUB_STEP_SUMMARY"
