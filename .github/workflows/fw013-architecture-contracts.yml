name: FW-013 Architecture Contracts (Temporary)

on:
  push:
    branches: [codex/v2-backlog-roadmap]
    paths:
      - .github/workflows/fw013-architecture-contracts.yml
      - docs/framework/schemas/*-v1.schema.json
      - experiments/fw013/validate_architecture_contracts.py

permissions:
  contents: read

jobs:
  contract-fixtures:
    name: Draft 2020-12 schema and invariant fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1
      - name: Validate versioned architecture contracts and positive/negative fixtures
        run: python experiments/fw013/validate_architecture_contracts.py
