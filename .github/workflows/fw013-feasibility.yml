name: FW-013 Feasibility Probe (Temporary)

on:
  push:
    branches: [codex/v2-backlog-roadmap]
    paths:
      - .github/workflows/fw013-feasibility.yml
      - docs/framework/FRAMEWORK-FEASIBILITY-008-fw013.md
      - experiments/fw013/**

permissions:
  contents: read

jobs:
  core-isolation:
    name: FEAS-01 Core isolation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Run isolated governance validator
        id: validate
        env:
          PYTHONPATH: ""
        run: python3 -I scripts/artifacts.py validate
      - name: Record core result
        if: always()
        env:
          RESULT: ${{ steps.validate.outcome }}
          RUN_SHA: ${{ github.sha }}
        run: |
          {
            echo "## FW-013 core isolation"
            echo "- Result: ${RESULT:-not-run}"
            echo "- Run commit: $RUN_SHA"
            echo "- Plan SHA-256: e35cdb129e9391a0177775c55a1d9b217bc5d4139f2019d67077b769530f8cfb"
            echo "- Command: python3 -I scripts/artifacts.py validate (PYTHONPATH empty)"
            python3 --version || true
          } >> "$GITHUB_STEP_SUMMARY"

  profile-probes:
    name: FEAS-02/03 ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [web, python, rust]
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create empty home and synthetic fixtures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fw013-empty-home"
          echo "HOME=$RUNNER_TEMP/fw013-empty-home" >> "$GITHUB_ENV"
          python3 experiments/fw013/generate_probe.py "$RUNNER_TEMP/fw013-probe"
          echo "PROBE_ROOT=$RUNNER_TEMP/fw013-probe" >> "$GITHUB_ENV"
      - name: Set up Node.js 22.23.3
        if: matrix.profile == 'web'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
      - name: Set up Python 3.13.2
        if: matrix.profile == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.2"
      - name: Install Rust 1.97.0
        if: matrix.profile == 'rust'
        shell: bash
        run: |
          command -v rustup
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Run Next.js profile and capture lock
        if: matrix.profile == 'web'
        working-directory: ${{ runner.temp }}/fw013-probe/web
        shell: bash
        run: |
          npm install --global npm@12.1.0
          test "$(npm --version)" = "12.1.0"
          node --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          sha256sum package-lock.json | tee "$RUNNER_TEMP/fw013-web-lock.sha256"
          cp package-lock.json "$RUNNER_TEMP/fw013-web-package-lock.json"
          mkdir -p "$RUNNER_TEMP/fw013-replay/web"
          cp -R . "$RUNNER_TEMP/fw013-replay/web/"
          cp -R "$PROBE_ROOT/fixtures" "$RUNNER_TEMP/fw013-replay/fixtures"
          cd "$RUNNER_TEMP/fw013-replay/web"
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Run FastAPI profile and capture lock
        if: matrix.profile == 'python'
        shell: bash
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/fw013-python-first"
          "$RUNNER_TEMP/fw013-python-first/bin/python" -m pip install --upgrade pip==26.2.2
          "$RUNNER_TEMP/fw013-python-first/bin/python" -m pip install -r "$PROBE_ROOT/api/requirements.in"
          "$RUNNER_TEMP/fw013-python-first/bin/python" -m pip freeze --all > "$RUNNER_TEMP/fw013-requirements.lock"
          python3 -m venv "$RUNNER_TEMP/fw013-python-replay"
          "$RUNNER_TEMP/fw013-python-replay/bin/python" -m pip install --upgrade pip==26.2.2
          "$RUNNER_TEMP/fw013-python-replay/bin/python" -m pip install -r "$RUNNER_TEMP/fw013-requirements.lock"
          cd "$PROBE_ROOT/api"
          "$RUNNER_TEMP/fw013-python-replay/bin/python" -m compileall -q .
          "$RUNNER_TEMP/fw013-python-replay/bin/python" -m pytest -q
          sha256sum "$RUNNER_TEMP/fw013-requirements.lock" | tee "$RUNNER_TEMP/fw013-python-lock.sha256"
      - name: Run Rust/Axum profile and capture lock
        if: matrix.profile == 'rust'
        working-directory: ${{ runner.temp }}/fw013-probe/rust
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo fetch --locked
          cp Cargo.lock "$RUNNER_TEMP/fw013-cargo-lock"
          cargo check --locked --offline
          cargo test --locked --offline
          sha256sum Cargo.lock | tee "$RUNNER_TEMP/fw013-rust-lock.sha256"
      - name: Record profile result and exact lockfile in run summary
        if: always()
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          JOB_STATUS: ${{ job.status }}
          RUN_SHA: ${{ github.sha }}
          GENERATOR_SHA: 0d42fc9c5215ff55a29f07dfc4c79ebd66a95c6541c81bd28e05165539453bcc
        run: |
          {
            echo "## FW-013 profile: $PROFILE"
            echo "- Job result: $JOB_STATUS"
            echo "- Run commit: $RUN_SHA"
            echo "- Fixture generator SHA-256: $GENERATOR_SHA"
            echo "- Plan SHA-256: e35cdb129e9391a0177775c55a1d9b217bc5d4139f2019d67077b769530f8cfb"
            echo "- Runner: $ImageOS / $ImageVersion ($RUNNER_ARCH)"
            echo "- Commands and individual fixture results: see this job's step logs."
            case "$PROFILE" in
              web) lock="$RUNNER_TEMP/fw013-web-package-lock.json" ;;
              python) lock="$RUNNER_TEMP/fw013-requirements.lock" ;;
              rust) lock="$RUNNER_TEMP/fw013-cargo-lock" ;;
            esac
            if [ -f "$lock" ]; then
              sha256sum "$lock"
              echo '```text'
              cat "$lock"
              echo '```'
            else
              echo "No resolved lockfile was produced; profile result is failed/unavailable, not pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
