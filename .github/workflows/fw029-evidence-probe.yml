name: FW-029 Synthetic Evidence Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-receipt:
    name: Resolve exact hosted checks and prepare synthetic receipt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Check out the dispatched source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve one exact Verify Pipeline run and construct receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT: ${{ github.event_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def api(endpoint):
              result = subprocess.run(
                  ["gh", "api", endpoint], check=True, capture_output=True, text=True
              )
              return json.loads(result.stdout)

          repo = os.environ["GH_REPOSITORY"]
          sha = os.environ["GH_SHA"]
          ref = os.environ["GH_REF"]
          ref_name = os.environ["GH_REF_NAME"]
          if os.environ["GH_EVENT"] != "workflow_dispatch":
              raise SystemExit("probe must be manually dispatched")
          if ref != "refs/heads/codex/v2-backlog-roadmap":
              raise SystemExit("probe is restricted to the authorized feature branch")

          runs_response = api(
              f"repos/{repo}/actions/workflows/verify-pipeline.yml/runs"
              f"?head_sha={sha}&event=push&per_page=100"
          )
          runs = runs_response["workflow_runs"]
          if runs_response.get("total_count") != len(runs) or len(runs) > 100:
              raise SystemExit("provider workflow run result is incomplete or unbounded")
          candidates = [
              run for run in runs
              if run.get("head_sha") == sha
              and run.get("head_branch") == ref_name
              and run.get("event") == "push"
              and run.get("path", "").split("@", 1)[0]
                  == ".github/workflows/verify-pipeline.yml"
          ]
          if len(candidates) != 1:
              raise SystemExit(f"expected one Verify Pipeline run, found {len(candidates)}")
          run = candidates[0]
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("exact Verify Pipeline run is not completed successfully")
          if not isinstance(run.get("run_attempt"), int) or run["run_attempt"] < 1:
              raise SystemExit("provider run attempt is missing or invalid")
          if run.get("head_sha") != sha or run.get("head_branch") != ref_name:
              raise SystemExit("provider run source SHA or ref mismatch")
          run_path = run.get("path", "")
          workflow_path, sep, workflow_ref = run_path.partition("@")
          if not sep or workflow_path != ".github/workflows/verify-pipeline.yml":
              raise SystemExit("provider workflow identity mismatch")

          jobs_response = api(
              f"repos/{repo}/actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs?per_page=100"
          )
          jobs = jobs_response["jobs"]
          expected = {
              "Metadata & Artifact Audit",
              "Initializer Regression Gate",
              "TypeScript Static Code Analysis",
          }
          if jobs_response.get("total_count") != len(jobs) or len(jobs) > 100:
              raise SystemExit("provider job result is incomplete or unbounded")
          named = {}
          for job in jobs:
              if job.get("name") in expected:
                  named.setdefault(job["name"], []).append(job)
          if set(named) != expected or any(len(items) != 1 for items in named.values()):
              raise SystemExit("required provider checks are missing or duplicated")

          check_records = []
          for name in sorted(expected):
              job = named[name][0]
              if job.get("run_id") != run["id"] or job.get("run_attempt") != run["run_attempt"]:
                  raise SystemExit(f"{name}: provider job run/attempt mismatch")
              if job.get("head_sha") != sha or job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit(f"{name}: provider job is not a success for the exact SHA")
              check_id = job.get("id")
              if not isinstance(check_id, int):
                  raise SystemExit(f"{name}: provider check ID is invalid")
              check = api(f"repos/{repo}/check-runs/{check_id}")
              app = check.get("app") or {}
              if app.get("id") != 15368 or app.get("slug") != "github-actions":
                  raise SystemExit(f"{name}: check was not created by GitHub Actions app 15368")
              suite = check.get("check_suite") or {}
              if suite.get("id") != run.get("check_suite_id"):
                  raise SystemExit(f"{name}: check suite does not belong to selected workflow run")
              if check.get("name") != name or check.get("head_sha") != sha:
                  raise SystemExit(f"{name}: check identity or source SHA mismatch")
              if check.get("status") != "completed" or check.get("conclusion") != "success":
                  raise SystemExit(f"{name}: check is not successful")
              check_records.append({
                  "id": check_id,
                  "name": name,
                  "app_id": app["id"],
                  "app_slug": app["slug"],
                  "check_suite_id": suite["id"],
                  "conclusion": check["conclusion"],
                  "head_sha": check["head_sha"],
              })

          repository = api(f"repos/{repo}")
          policy = {
              "schema": "sdd-required-checks/v1",
              "profile": "governance-receipt-probe",
              "expected_ref": "refs/heads/codex/v2-backlog-roadmap",
              "expected_event": "push",
              "workflow_path": ".github/workflows/verify-pipeline.yml",
              "expected_app_id": 15368,
              "expected_app_slug": "github-actions",
              "required_check_names": sorted(expected),
          }
          canonical = lambda value: json.dumps(
              value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          receipt = {
              "schema": "sdd-ci-evidence-receipt/v1",
              "repository": {"full_name": repo, "id": repository["id"]},
              "source": {"sha": sha, "ref": ref, "event": run["event"]},
              "workflow": {
                  "path": workflow_path,
                  "ref": workflow_ref,
                  "revision": sha,
                  "run_id": run["id"],
                  "run_attempt": run["run_attempt"],
                  "check_suite_id": run["check_suite_id"],
              },
              "required_check_manifest_sha256": hashlib.sha256(canonical(policy)).hexdigest(),
              "checks": check_records,
              "checks_sha256": hashlib.sha256(canonical(check_records)).hexdigest(),
          }
          Path("receipt.json").write_bytes(canonical(receipt))
          print("Prepared bounded receipt for exact successful hosted run; no source or logs included.")
          PY

      - name: Upload receipt for isolated signing job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fw029-synthetic-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 1

  sign-receipt:
    name: Sign receipt with hosted ephemeral identity
    needs: prepare-receipt
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download only the bounded receipt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: fw029-synthetic-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fw029-receipt

      - name: Attest receipt bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/fw029-receipt/receipt.json

      - name: Download the generated attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RECEIPT_PATH: ${{ runner.temp }}/fw029-receipt/receipt.json
          BUNDLE_DIR: ${{ runner.temp }}/fw029-attestation-bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"
          gh attestation download "$RECEIPT_PATH" --repo "$GH_REPOSITORY" >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path

          bundles = list(Path(os.environ["BUNDLE_DIR"]).glob("sha256-*.jsonl"))
          if len(bundles) != 1 or bundles[0].is_symlink() or bundles[0].stat().st_size > 4_194_304:
              raise SystemExit("expected one bounded attestation bundle")
          PY

      - name: Preserve receipt and bundle briefly for offline verification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fw029-receipt-and-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fw029-receipt/receipt.json
            ${{ runner.temp }}/fw029-attestation-bundle/sha256-*.jsonl
          if-no-files-found: error
          retention-days: 1
